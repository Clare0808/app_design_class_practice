<!doctype html>
<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>日序 Daymark｜個人行程與任務</title>
<style>
  :root{--paper:#f7f6f3;--surface:#fff;--ink:#202521;--muted:#858b85;--line:#eaece7;--green:#548265;--green-bg:#e8f1e9;--orange:#d28846;--orange-bg:#fbf0e4;--red:#d45f5a;--red-bg:#fae9e7;--shadow:0 14px 38px rgba(32,37,33,.055)}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh} button,input{font:inherit} button{cursor:pointer}
  .app{max-width:1440px;margin:0 auto;padding:30px 42px 40px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;gap:12px;align-items:center}.brand-mark{width:39px;height:39px;border-radius:13px;background:#315d48;color:white;display:grid;place-items:center;font-size:19px;font-weight:700}.brand-name{font-weight:750;font-size:18px;letter-spacing:.02em}.brand-sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.1em}.top-actions{display:flex;align-items:center;gap:15px}.today-link{font-size:13px;font-weight:600;border:0;background:transparent;color:#626b64;padding:9px 12px;border-radius:9px}.today-link:hover{background:#eeefeb}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eee4d8;color:#765f46;font-size:13px;font-weight:700}
  .greeting{margin:0 0 27px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--green);font-weight:700;text-transform:uppercase}.greeting h1{font-size:30px;letter-spacing:-.04em;margin:7px 0 5px;font-weight:650}.greeting p{font-size:13px;color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:minmax(520px,1.13fr) minmax(380px,.87fr);gap:22px;align-items:start}.panel{background:var(--surface);border:1px solid #eeefeb;border-radius:18px;box-shadow:var(--shadow)}.calendar-panel{padding:26px 28px 24px}.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.month-title{display:flex;align-items:baseline;gap:9px}.month-title h2{font-size:22px;letter-spacing:-.04em;margin:0;font-weight:680}.month-title span{font-size:13px;color:var(--muted)}.month-nav{display:flex;gap:7px}.icon-btn{border:1px solid var(--line);background:white;width:34px;height:34px;border-radius:10px;color:#666e68;font-size:17px;display:grid;place-items:center}.icon-btn:hover{background:#f5f6f2}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.weekdays{margin-bottom:9px}.weekdays div{font-size:11px;color:#9a9e99;font-weight:600;padding:7px 0}.weekdays div:first-child{color:#d28a7d}.calendar-grid{row-gap:5px}.day{position:relative;min-height:82px;border:0;background:transparent;border-radius:12px;color:var(--ink);padding:8px 5px 5px;display:flex;align-items:center;flex-direction:column;gap:5px;transition:background .15s}.day:hover{background:#f5f6f2}.day.outside{color:#c5c9c4}.day.selected{background:#edf3ed}.day.today .day-num{background:#315d48;color:#fff}.day-num{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:550}.day.outside .day-num{font-weight:400}.day-dots{height:7px;display:flex;gap:3px;justify-content:center}.dot{width:5px;height:5px;border-radius:50%;display:block}.dot.green{background:var(--green)}.dot.orange{background:var(--orange)}.dot.red{background:var(--red)}.day-count{font-size:9px;color:#858b85;line-height:1}.legend{border-top:1px solid var(--line);padding-top:17px;margin-top:16px;display:flex;gap:17px;flex-wrap:wrap}.legend-item{font-size:11px;color:#858b85;display:flex;align-items:center;gap:6px}.legend-swatch{width:7px;height:7px;border-radius:50%}.right-col{display:flex;flex-direction:column;gap:16px}.summary{background:#315d48;border-radius:18px;color:#fff;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(49,93,72,.15)}.summary-copy .small{font-size:11px;opacity:.72;letter-spacing:.09em}.summary-copy h2{font-size:22px;margin:5px 0 0;letter-spacing:-.03em}.summary-count{text-align:right}.summary-count strong{font-size:33px;font-weight:600;line-height:1}.summary-count span{font-size:11px;opacity:.75;margin-left:5px}.tasks-panel{padding:23px 23px 19px;min-height:280px}.tasks-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px}.tasks-head h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}.tasks-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.add-btn{background:#315d48;color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:650;display:flex;gap:6px;align-items:center}.add-btn:hover{background:#244a38}.task-list{display:flex;flex-direction:column}.task-row{display:flex;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid #f0f1ee}.task-row:last-child{border:0}.check{width:18px;height:18px;border-radius:6px;border:1.5px solid #d4d9d3;background:#fff;flex:none;display:grid;place-items:center;color:white;font-size:12px;padding:0}.check:hover{border-color:var(--green)}.task-row.done .check{background:var(--green);border-color:var(--green)}.task-row.done .task-name{text-decoration:line-through;color:#a0a59f}.task-content{min-width:0;flex:1}.task-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{display:flex;gap:8px;align-items:center;margin-top:5px}.task-time{font-size:10px;color:#929892}.badge{font-size:9px;padding:3px 7px;border-radius:20px;font-weight:650}.badge.red{color:var(--red);background:var(--red-bg)}.badge.orange{color:var(--orange);background:var(--orange-bg)}.badge.green{color:var(--green);background:var(--green-bg)}.delete-btn{border:0;background:transparent;color:#bdc1bc;font-size:17px;padding:5px}.delete-btn:hover{color:var(--red)}.edit-btn{border:0;background:transparent;color:#8a938b;font-size:11px;font-weight:600;padding:6px 7px;border-radius:6px}.edit-btn:hover{background:#edf3ed;color:var(--green)}.empty{padding:34px 10px;text-align:center;color:#929892;font-size:12px;line-height:1.8}.empty-icon{font-size:23px;margin-bottom:5px}.upcoming-panel{padding:19px 22px}.upcoming-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.upcoming-head h3{margin:0;font-size:13px}.upcoming-head span{font-size:10px;color:var(--muted)}.upcoming-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f0f1ee}.upcoming-item:last-child{border:0;padding-bottom:0}.upcoming-date{width:32px;height:32px;border-radius:9px;background:#f4f5f1;display:grid;place-items:center;font-size:10px;color:#737a74;line-height:1.1;text-align:center}.upcoming-title{font-size:11px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upcoming-time{font-size:10px;color:var(--muted)}.footer-note{font-size:10px;color:#a1a59f;text-align:center;margin-top:16px}
  .projects-panel{margin:0 0 22px;padding:23px 23px 20px}.project-tabs{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:3px 0 0;margin:0 0 16px;border-bottom:1px solid var(--line);scrollbar-width:thin}.project-tab{position:relative;flex:0 0 auto;max-width:220px;padding:9px 14px 11px;border:0;border-radius:10px 10px 0 0;background:transparent;color:#737a74;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-tab:hover{background:#f5f6f2;color:var(--ink)}.project-tab.active{background:#edf3ed;color:#315d48}.project-tab.active:after{content:"";position:absolute;bottom:0;left:12px;right:12px;height:2px;background:#548265;border-radius:2px}.project-tab:focus-visible{outline:2px solid #81a08b;outline-offset:-2px}.project-list{display:flex;flex-direction:column;gap:14px}.project-card{border:1px solid #edf0eb;border-radius:13px;padding:15px}.project-top{display:flex;align-items:flex-start;gap:10px}.project-title{font-size:13px;font-weight:700;flex:1;overflow-wrap:anywhere}.project-dates{font-size:10px;color:var(--muted);margin-top:5px}.project-percent{font-size:14px;font-weight:700;white-space:nowrap}.project-gantt{height:12px;background:#f0f1ee;border-radius:99px;overflow:hidden;margin:13px 0 8px}.project-gantt-fill{height:100%;border-radius:inherit;transition:width .2s ease}.project-gantt-fill.red{background:var(--red)}.project-gantt-fill.orange{background:var(--orange)}.project-gantt-fill.green{background:var(--green)}.project-progress-meta{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#858b85}.project-actions{display:flex;align-items:center;gap:8px;margin-top:12px}.project-range{flex:1;accent-color:var(--green);min-width:80px}.progress-value{font-size:11px;font-weight:700;min-width:36px;text-align:right}.project-empty{padding:24px 10px;text-align:center;color:#929892;font-size:12px;line-height:1.8}.project-delete{border:0;background:transparent;color:#bdc1bc;padding:5px}.project-delete:hover{color:var(--red)}.project-modal .field input[type=range]{padding:0;accent-color:var(--green)}  .modal-backdrop{position:fixed;inset:0;background:rgba(25,32,27,.34);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.open{display:flex}.modal{width:min(420px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.18)}.modal h2{margin:0;font-size:19px}.modal p{font-size:12px;color:var(--muted);margin:6px 0 19px}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:11px;font-weight:650;color:#616862}.field input{border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:13px;outline:none;color:var(--ink)}.field input:focus{border-color:#81a08b;box-shadow:0 0 0 3px #eaf1eb}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.modal-actions button{padding:10px 15px;border-radius:9px;font-size:12px;font-weight:650}.cancel-btn{border:1px solid var(--line);background:#fff;color:#6e756f}.save-btn{border:0;background:#315d48;color:#fff}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,15px);padding:10px 15px;border-radius:9px;background:#28372e;color:white;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:900px){.app{padding:22px 20px 32px}.layout{grid-template-columns:1fr}.calendar-panel{padding:22px}.right-col{display:grid;grid-template-columns:1fr 1fr;align-items:start}.summary{grid-column:1/-1}.tasks-panel{grid-row:2}.upcoming-panel{grid-row:2}}
  @media(max-width:620px){.app{padding:17px 13px 25px}.topbar{margin-bottom:20px}.greeting h1{font-size:25px}.layout{gap:13px}.calendar-panel{padding:17px 12px}.month-title h2{font-size:19px}.day{min-height:66px;gap:3px;padding-top:6px}.day-num{width:27px;height:27px;font-size:12px}.weekdays div{font-size:10px}.calendar-grid{row-gap:2px}.right-col{display:flex}.tasks-panel{padding:19px 17px}.summary{padding:19px}.legend{gap:11px}.legend-item{font-size:10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">日</div><div><div class="brand-name">日序 <span style="font-weight:450;color:#8b918b">Daymark</span></div><div class="brand-sub">MAKE ROOM FOR WHAT MATTERS</div></div></div>
    <div class="top-actions"><button class="today-link" id="todayBtn">回到今天</button><div class="avatar" title="個人工作區">我</div></div>
  </header>
  <section class="greeting"><div class="eyebrow" id="greetingDate">PERSONAL PLANNER</div><h1 id="greetingTitle">把重要的事，安排進生活。</h1><p id="greetingSub">清楚看見接下來的每一步。</p></section>
<section class="panel projects-panel" aria-labelledby="projectsHeading"><div class="tasks-head"><div><h2 id="projectsHeading">長期進度追蹤</h2><p>每日更新進度，掌握專案步調</p></div><button class="add-btn" id="addProjectBtn"><span style="font-size:16px;line-height:12px">＋</span> 新增專案</button></div><div id="projectTabs" class="project-tabs" role="tablist" aria-label="選擇長期專案"></div><div id="projectList" class="project-list"></div></section>
    <main class="layout">
    <section class="panel calendar-panel" aria-label="月曆">
      <div class="month-head"><div class="month-title"><h2 id="monthTitle"></h2><span id="yearTitle"></span></div><div class="month-nav"><button class="icon-btn" id="prevMonth" aria-label="上個月">‹</button><button class="icon-btn" id="nextMonth" aria-label="下個月">›</button></div></div>
      <div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="legend"><div class="legend-item"><i class="legend-swatch" style="background:var(--red)"></i>今天截止</div><div class="legend-item"><i class="legend-swatch" style="background:var(--orange)"></i>3 日內截止</div><div class="legend-item"><i class="legend-swatch" style="background:var(--green)"></i>其他待辦</div></div>
    </section>
    <div class="right-col">
      <section class="summary"><div class="summary-copy"><div class="small" id="summaryLabel">TODAY'S FOCUS</div><h2 id="summaryDate"></h2></div><div class="summary-count"><strong id="summaryCount">0</strong><span>項待辦</span></div></section>
      <section class="panel tasks-panel"><div class="tasks-head"><div><h2 id="taskHeading">今日待辦</h2><p id="taskSubheading">先完成最重要的一步</p></div><button class="add-btn" id="addBtn"><span style="font-size:16px;line-height:12px">＋</span> 新增待辦</button></div><div class="task-list" id="taskList"></div></section>
      <section class="panel upcoming-panel"><div class="upcoming-head"><h3>接下來的截止事項</h3><span>未完成</span></div><div id="upcomingList"></div></section>
    </div>
  </main>
  <div class="footer-note">你的行程只儲存在這部裝置上。</div>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form class="modal" id="taskForm"><h2 id="modalTitle">新增待辦</h2><p>記下來，讓重要的事不再被忘記。</p><div class="field"><label for="taskName">待辦事項</label><input id="taskName" name="name" maxlength="80" placeholder="例如：完成專題簡報" required /></div><div class="field"><label for="taskDate">截止日期</label><input id="taskDate" name="date" type="date" required /></div><div class="field"><label for="taskTime">截止時間</label><input id="taskTime" name="time" type="time" value="17:00" required /></div><div class="modal-actions"><button type="button" class="cancel-btn" id="cancelBtn">取消</button><button type="submit" class="save-btn" id="saveTaskBtn">儲存待辦</button></div></form></div>
<div class="modal-backdrop" id="projectModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle"><form class="modal project-modal" id="projectForm"><h2 id="projectModalTitle">新增長期專案</h2><p>設定專案期間，並每日記錄目前完成率。</p><div class="field"><label for="projectName">專案／事項名稱</label><input id="projectName" maxlength="80" placeholder="例如：完成畢業專題" required /></div><div class="field"><label for="projectStart">起始日期</label><input id="projectStart" type="date" required /></div><div class="field"><label for="projectEnd">結束日期</label><input id="projectEnd" type="date" required /></div><div class="field"><label for="projectProgress">目前完成率 <span id="projectProgressValue">0%</span></label><input id="projectProgress" type="range" min="0" max="100" step="1" value="0" /></div><div class="modal-actions"><button type="button" class="cancel-btn" id="cancelProjectBtn">取消</button><button type="submit" class="save-btn" id="saveProjectBtn">新增專案</button></div></form></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const today = new Date(); today.setHours(0,0,0,0);
  const todayKey = keyOf(today);
  const STORAGE_KEY = 'daymark-tasks-v1';
  const PROJECTS_STORAGE_KEY = 'daymark-projects-v1';
  const sampleOffset = (n) => { const d=new Date(today); d.setDate(d.getDate()+n); return keyOf(d); };
  const examples = [
    {id:'demo-1',name:'繳交設計思考作業',date:sampleOffset(0),time:'17:00',done:false},
    {id:'demo-2',name:'回覆專案合作信件',date:sampleOffset(1),time:'12:00',done:false},
    {id:'demo-3',name:'準備下週讀書計畫',date:sampleOffset(3),time:'20:00',done:false},
    {id:'demo-4',name:'整理本週會議筆記',date:sampleOffset(0),time:'10:30',done:true},
    {id:'demo-5',name:'預約例行健康檢查',date:sampleOffset(5),time:'09:30',done:false},
  ];
  let projects = loadProjects(); let activeProjectId=projects[0]?.id??null;
  let tasks = loadTasks(); let viewMonth=new Date(today.getFullYear(),today.getMonth(),1); let selected=new Date(today); let toastTimer; let editingTaskId=null;
  const $ = id => document.getElementById(id);
  function keyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function parseKey(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
  function loadTasks(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw===null){localStorage.setItem(STORAGE_KEY,JSON.stringify(examples));return examples}const v=JSON.parse(raw);return Array.isArray(v)?v:examples}catch{return examples}}
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks))}catch(error){console.warn('無法寫入本機儲存空間',error)}}
  function loadProjects(){try{const raw=localStorage.getItem(PROJECTS_STORAGE_KEY);if(raw===null)return [];const value=JSON.parse(raw);return Array.isArray(value)?value:[]}catch(error){console.warn('無法讀取專案進度',error);return []}}
  function saveProjects(){try{localStorage.setItem(PROJECTS_STORAGE_KEY,JSON.stringify(projects))}catch(error){console.warn('無法寫入專案進度',error);showToast('儲存失敗，請確認瀏覽器儲存空間設定')}}
  projects = loadProjects();
  function dayDiff(dateKey){return Math.round((parseKey(dateKey)-today)/86400000)}
  function urgency(dateKey){const n=dayDiff(dateKey);return n===0?'red':n>0&&n<=3?'orange':'green'}
  function formatDate(d,opts={month:'long',day:'numeric',weekday:'short'}){return new Intl.DateTimeFormat('zh-TW',opts).format(d)}
  function tasksOn(dateKey){return tasks.filter(t=>t.date===dateKey)}
  function renderCalendar(){
    $('monthTitle').textContent=new Intl.DateTimeFormat('zh-TW',{month:'long'}).format(viewMonth);
    $('yearTitle').textContent=`${viewMonth.getFullYear()}`;
    const grid=$('calendarGrid');grid.innerHTML='';
    const first=new Date(viewMonth.getFullYear(),viewMonth.getMonth(),1);const start=new Date(first);start.setDate(1-first.getDay());
    for(let i=0;i<42;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);const k=keyOf(d);const list=tasksOn(k);
      const btn=document.createElement('button');btn.className='day'+(d.getMonth()!==viewMonth.getMonth()?' outside':'')+(k===todayKey?' today':'')+(k===keyOf(selected)?' selected':'');btn.setAttribute('aria-label',`${formatDate(d)}，${list.length} 項待辦`);btn.setAttribute('aria-pressed',String(k===keyOf(selected)));
      btn.innerHTML=`<span class="day-num">${d.getDate()}</span><span class="day-dots">${list.slice(0,3).map(t=>`<i class="dot ${urgency(t.date)}"></i>`).join('')}</span>${list.length>3?`<span class="day-count">+${list.length-3}</span>`:''}`;
      btn.addEventListener('click',()=>{selected=new Date(d);render()});grid.appendChild(btn);
    }
  }
  function renderTasks(){
    const dateKey=keyOf(selected), dateTasks=tasksOn(dateKey).sort((a,b)=>a.time.localeCompare(b.time));
    const isToday=dateKey===todayKey;$('summaryLabel').textContent=isToday?"TODAY'S FOCUS":'SELECTED DAY';$('summaryDate').textContent=isToday?'今天':formatDate(selected,{month:'long',day:'numeric',weekday:'short'});$('summaryCount').textContent=dateTasks.filter(t=>!t.done).length;
    $('taskHeading').textContent=isToday?'今日待辦':`${selected.getMonth()+1} 月 ${selected.getDate()} 日待辦`;$('taskSubheading').textContent=dateTasks.length?'依截止時間排列，準時完成每一步':'今天留白，也是一種安排';
    const list=$('taskList');list.innerHTML='';
    if(!dateTasks.length){list.innerHTML='<div class="empty"><div class="empty-icon">✦</div>這天還沒有待辦事項<br>按下「新增待辦」開始安排。</div>';return}
    for(const task of dateTasks){const row=document.createElement('div');row.className='task-row'+(task.done?' done':'');const color=urgency(task.date);const due=dayDiff(task.date)<0?'已逾期':color==='red'?'今天截止':color==='orange'?'即將截止':'待處理';row.innerHTML=`<button class="check" aria-label="${task.done?'標記未完成':'標記完成'}">${task.done?'✓':''}</button><div class="task-content"><div class="task-name" title="${escapeHtml(task.name)}">${escapeHtml(task.name)}</div><div class="task-meta"><span class="task-time">${task.time} 截止</span><span class="badge ${color}">${due}</span></div></div><button class="edit-btn" aria-label="編輯 ${escapeHtml(task.name)}" title="編輯">編輯</button><button class="delete-btn" aria-label="刪除 ${escapeHtml(task.name)}" title="刪除">×</button>`;
      row.querySelector('.check').addEventListener('click',()=>{task.done=!task.done;save();render();showToast(task.done?'已完成待辦':'已恢復待辦')});row.querySelector('.edit-btn').addEventListener('click',()=>openModal(task));row.querySelector('.delete-btn').addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render();showToast('已刪除待辦')});list.appendChild(row)}
  }
  function renderUpcoming(){const upcoming=tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)).slice(0,4);const box=$('upcomingList');box.innerHTML='';if(!upcoming.length){box.innerHTML='<div class="empty" style="padding:20px 5px">目前沒有待處理的截止事項</div>';return}for(const t of upcoming){const d=parseKey(t.date),item=document.createElement('div');item.className='upcoming-item';item.innerHTML=`<div class="upcoming-date">${d.getMonth()+1}/${d.getDate()}</div><div class="upcoming-title" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div><div class="upcoming-time">${t.time}</div>`;item.addEventListener('click',()=>{selected=d;viewMonth=new Date(d.getFullYear(),d.getMonth(),1);render()});box.appendChild(item)}}
  function projectColor(progress){return progress<30?'red':progress<70?'orange':'green'}
    function renderProjects(){
    const tabs=$('projectTabs'),list=$('projectList');if(!tabs||!list)return;tabs.innerHTML='';list.innerHTML='';
    if(!projects.length){activeProjectId=null;tabs.hidden=true;list.innerHTML='<div class="project-empty">還沒有長期專案。<br>建立一個專案，開始追蹤你的進度。</div>';return}
    tabs.hidden=false;if(!projects.some(project=>project.id===activeProjectId))activeProjectId=projects[0].id;
    for(const project of projects){const tab=document.createElement('button');tab.type='button';tab.className='project-tab'+(project.id===activeProjectId?' active':'');tab.id=`project-tab-${project.id}`;tab.setAttribute('role','tab');tab.setAttribute('aria-selected',String(project.id===activeProjectId));tab.setAttribute('aria-controls','projectList');tab.tabIndex=project.id===activeProjectId?0:-1;tab.title=project.name;tab.textContent=project.name;tab.addEventListener('click',()=>{activeProjectId=project.id;renderProjects()});tab.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;e.preventDefault();const index=projects.findIndex(item=>item.id===project.id),direction=e.key==='ArrowRight'?1:-1;activeProjectId=projects[(index+direction+projects.length)%projects.length].id;renderProjects();tabs.querySelector('.project-tab.active')?.focus()});tabs.appendChild(tab)}
    const project=projects.find(item=>item.id===activeProjectId);if(!project)return;
    const progress=Math.max(0,Math.min(100,Number(project.progress)||0));const color=projectColor(progress);const start=parseKey(project.start),end=parseKey(project.end);const card=document.createElement('article');card.className='project-card';card.setAttribute('role','tabpanel');card.setAttribute('aria-labelledby',`project-tab-${project.id}`);
    card.innerHTML=`<div class="project-top"><div class="project-title">${escapeHtml(project.name)}</div><div class="project-percent" style="color:var(--${color})">${progress}%</div><button type="button" class="project-delete" aria-label="刪除專案 ${escapeHtml(project.name)}" title="刪除專案">×</button></div><div class="project-dates">${formatDate(start,{year:'numeric',month:'short',day:'numeric'})} — ${formatDate(end,{year:'numeric',month:'short',day:'numeric'})}</div><div class="project-gantt" role="img" aria-label="專案進度 ${progress}%"><div class="project-gantt-fill ${color}" style="width:${progress}%"></div></div><div class="project-progress-meta"><span>開始</span><span>${progress<30?'需要加把勁':progress<70?'穩定前進':'進度良好'}</span><span>目標完成</span></div><div class="project-actions"><label for="progress-${escapeHtml(project.id)}" class="task-time">更新進度</label><input class="project-range" id="progress-${escapeHtml(project.id)}" type="range" min="0" max="100" step="1" value="${progress}" aria-label="${escapeHtml(project.name)}目前完成率"><span class="progress-value">${progress}%</span><button type="button" class="edit-btn project-save">儲存</button></div><div class="project-progress-meta"><span>上次更新：${project.updatedAt?formatDate(parseKey(project.updatedAt),{month:'short',day:'numeric'}):'尚未更新'}</span></div>`;
    const range=card.querySelector('.project-range');range.addEventListener('input',()=>{card.querySelector('.progress-value').textContent=`${range.value}%`});card.querySelector('.project-save').addEventListener('click',()=>{project.progress=Number(range.value);project.updatedAt=todayKey;saveProjects();renderProjects();showToast(`已更新「${project.name}」進度至 ${project.progress}%`)});
    card.querySelector('.project-delete').addEventListener('click',()=>{if(!confirm(`確定要刪除「${project.name}」的進度追蹤嗎？`))return;projects=projects.filter(item=>item.id!==project.id);if(activeProjectId===project.id)activeProjectId=projects[0]?.id??null;saveProjects();renderProjects();showToast('已刪除專案')});list.appendChild(card);
  }
$('addProjectBtn').addEventListener('click',openProjectModal);
  $('cancelProjectBtn').addEventListener('click',()=>$('projectModalBackdrop').classList.remove('open'));
  $('projectModalBackdrop').addEventListener('click',e=>{if(e.target===$('projectModalBackdrop'))$('projectModalBackdrop').classList.remove('open')});
  $('projectProgress').addEventListener('input',e=>{$('projectProgressValue').textContent=`${e.target.value}%`});
  $('projectForm').addEventListener('submit',e=>{e.preventDefault();const name=$('projectName').value.trim(),start=$('projectStart').value,end=$('projectEnd').value,progress=Number($('projectProgress').value);if(!name||!start||!end)return;if(end<start){$('projectEnd').setCustomValidity('結束日期不可早於起始日期');$('projectEnd').reportValidity();$('projectEnd').setCustomValidity('');return}const project={id:crypto.randomUUID?crypto.randomUUID():`project-${Date.now()}`,name,start,end,progress,createdAt:todayKey,updatedAt:todayKey};projects.push(project);activeProjectId=project.id;saveProjects();renderProjects();$('projectModalBackdrop').classList.remove('open');showToast('已新增長期專案')});
  function openProjectModal(){const form=$('projectForm');form.reset();$('projectStart').value=todayKey;$('projectEnd').value=sampleOffset(30);$('projectProgress').value=0;$('projectProgressValue').textContent='0%';$('projectModalBackdrop').classList.add('open');setTimeout(()=>$('projectName').focus(),40)}
  function render(){renderCalendar();renderTasks();renderUpcoming();renderProjects();$('greetingDate').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(today)}
  window.addEventListener('error',e=>{console.error('日序初始化或操作發生錯誤：',e.message);const list=$('taskList');if(list&&!list.children.length)list.innerHTML='<div class="empty">待辦清單載入時發生問題。請重新整理頁面，或清除本機資料後再試。</div>';});
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function showToast(text){const t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}
  function openModal(task=null){ editingTaskId=task?.id??null; $('modalTitle').textContent=task?'編輯待辦':'新增待辦';$('saveTaskBtn').textContent=task?'儲存修改':'儲存待辦';$('taskName').value=task?.name??'';$('taskDate').value=task?.date??keyOf(selected);$('taskTime').value=task?.time??'17:00';$('modalBackdrop').classList.add('open');setTimeout(()=>$('taskName').focus(),40)}
  function closeModal(){ $('modalBackdrop').classList.remove('open');editingTaskId=null }
  $('prevMonth').addEventListener('click',()=>{viewMonth.setMonth(viewMonth.getMonth()-1);renderCalendar()});$('nextMonth').addEventListener('click',()=>{viewMonth.setMonth(viewMonth.getMonth()+1);renderCalendar()});
  $('todayBtn').addEventListener('click',()=>{selected=new Date(today);viewMonth=new Date(today.getFullYear(),today.getMonth(),1);render()});$('addBtn').addEventListener('click',openModal);$('cancelBtn').addEventListener('click',closeModal);$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('projectModalBackdrop').classList.remove('open')}});
  $('taskForm').addEventListener('submit',e=>{e.preventDefault();const name=$('taskName').value.trim(),date=$('taskDate').value,time=$('taskTime').value;if(!name||!date||!time)return;const wasEditing=Boolean(editingTaskId);if(wasEditing){const task=tasks.find(t=>t.id===editingTaskId);if(task)Object.assign(task,{name,date,time})}else{tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,date,time,done:false})}save();selected=parseKey(date);viewMonth=new Date(selected.getFullYear(),selected.getMonth(),1);render();closeModal();$('taskForm').reset();showToast(wasEditing?'待辦已更新':'待辦已新增')});
  render();
})();
</script>
</body>
</html>
