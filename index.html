<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .card {
      background: white;
      padding: 2.5rem 3rem;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    h1 {
      color: #4a5568;
      font-size: 2.25rem;
      margin-bottom: 0.75rem;
    }

    p {
      color: #718096;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    button {
      background-color: #667eea;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #5a67d8;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      margin-top: 1rem;
      font-weight: 500;
      color: #38a169;
      min-height: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p>歡迎來到我的第一個網頁！點擊下方按鈕試試看互動效果：</p>
    <button id="btn" onclick="sayHello()">點擊我！</button>
    <p id="message"></p>
  </div>

  <script>
    function sayHello() {
      const msg = document.getElementById('message');
      msg.textContent = '🎉 你好，世界！歡迎開始網頁開發之旅！';
    }
  </script>
</body>
</html>
